# V4 tracker configuration. Tune remaining association settings against labelled MOT ground truth.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.05
new_track_thresh: 0.25
track_buffer: 180
match_thresh: 0.80
# Tiny aerial detections are often low-confidence even when their geometry is
# usable. Score fusion penalized those matches and caused verified ID handoffs.
fuse_score: false
gmc_method: sparseOptFlow
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: false
model: auto
